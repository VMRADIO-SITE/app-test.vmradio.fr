<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09020f">
<meta name="description" content="Télécharger et installer l'application VM RADIO.">
<link rel="manifest" href="./manifest.webmanifest?v=25">

<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=25">
<title>Télécharger l'application — VM RADIO</title>
<style>
:root{color-scheme:dark;--bg:#07020d;--panel:#11081b;--line:#5e2a7d;--violet:#b85cff;--violet2:#7b35dc;--text:#fff;--muted:#c9bfd2}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#24103a 0,#0d0415 42%,#07020d 100%);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.page{width:min(1080px,100%);margin:auto;padding:18px 18px 38px}.hero{text-align:center;padding:20px 18px 14px}.logo{width:96px;height:96px;object-fit:contain;border-radius:22px;display:block;margin:0 auto 15px;box-shadow:0 0 28px #8d42b855}h1{margin:0;font-size:clamp(26px,4.5vw,42px);font-weight:900;letter-spacing:-.6px;text-transform:uppercase;line-height:1.05}h1 span{display:block;color:#d39aff}.intro{max-width:560px;margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.45}
.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.platform{appearance:none;width:100%;min-height:210px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#190c25,#0e0615);color:#fff;padding:20px 14px;cursor:pointer;text-align:center;transition:transform .18s,border-color .18s,box-shadow .18s}.platform:hover,.platform:focus-visible{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 12px 35px #0008;outline:none}.platform-icon{height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.platform-icon svg{width:42px;height:42px;display:block;fill:currentColor}.platform h2{margin:0 0 8px;font-size:17px}.platform p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.choose{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:11px;background:#21102f;border:1px solid #9d4de0;font-size:11px;font-weight:800}
.bottom{text-align:center;margin-top:22px}.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;padding:11px 20px;border-radius:13px;background:linear-gradient(135deg,var(--violet),var(--violet2));font-weight:900;font-size:14px;box-shadow:0 8px 28px #7b35dc44}.small{margin:11px 0 0;color:#8e8498;font-size:11px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:#000b;z-index:50}.overlay.open{display:flex}.dialog{width:min(500px,calc(100% - 20px));max-height:calc(100vh - 24px);overflow:hidden;background:linear-gradient(160deg,#1b0b27,#0d0513);border:2px solid var(--violet);border-radius:22px;padding:16px;box-shadow:0 20px 70px #000b}.dialog-head{text-align:center}.dialog-icon{height:44px;display:flex;align-items:center;justify-content:center}.dialog-icon svg{width:40px;height:40px;display:block;fill:currentColor}.dialog h2{margin:6px 0 3px;font-size:21px}.dialog-sub{margin:0;color:var(--muted);font-size:13px;line-height:1.3}.steps{margin:12px 0 0;padding:11px 14px;border:1px solid #543463;border-radius:14px;background:#0a050e}.steps ol{margin:0;padding-left:20px}.steps li{padding:3px 0;line-height:1.3;font-size:13px}.install{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:11px;border:0;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#c35cff,#7633d6);color:#fff;font-size:14px;font-weight:900;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.install:active{transform:scale(.98)}.install svg{width:20px;height:20px;fill:currentColor;flex:none}.status{margin-top:9px;padding:9px;border:1px solid #4b3158;border-radius:12px;color:#ddd;background:#0a050e;line-height:1.35;font-size:12px}.close{display:block;margin:9px auto 0;border:1px solid #8743ae;background:#1c0d27;color:#fff;border-radius:10px;padding:7px 18px;font-size:12px;font-weight:800;cursor:pointer}
@media(max-width:850px){.platforms{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.page{padding:10px 12px 30px}.hero{padding:18px 8px 12px}.logo{width:84px;height:84px}.platforms{grid-template-columns:1fr}.platform{min-height:190px}.dialog{padding:14px;width:calc(100% - 20px)}.dialog h2{font-size:20px}.install{min-height:44px}}
</style>
<script src="vm-radio-flux-central.js?v=20260829-sourcehalo1"></script>
</head>
<body>
<main class="page">
<section class="hero">
<img class="logo" src="./vmradio-app-logo.png?v=25" alt="VM RADIO">
<h1>Télécharger<span>l'application</span></h1>
<p class="intro">Installe VM RADIO sur ton appareil et retrouve ta radio directement depuis ton écran d'accueil.</p>
</section>
<section class="platforms" aria-label="Choisir un appareil">
<button class="platform" data-platform="ios" type="button"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Apple"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8z"/></svg></div><h2>iPhone / iPad</h2><p>Installation depuis Safari avec « Sur l'écran d'accueil ».</p><span class="choose">Voir l'installation</span></button>
<button class="platform" data-platform="android" type="button"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Android"><path d="M7.2 9.2v8.1c0 .6.5 1.1 1.1 1.1h.8v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h1.4v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h.8c.6 0 1.1-.5 1.1-1.1V9.2H7.2zM5.8 9.2c-.6 0-1.1.5-1.1 1.1v6.3c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zm12.4 0c-.6 0-1.1.5-1.1 1.1v6.3c0 .6-.5 1.1-1.1 1.1s-1.1-.5-1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zM8 8.2h8c-.2-1.5-1-2.7-2.1-3.5l.9-1.4c.2-.3.1-.6-.2-.8-.3-.2-.6-.1-.8.2l-.9 1.4c-.6-.2-1.2-.3-1.9-.3s-1.3.1-1.9.3l-.9-1.4c-.2-.3-.5-.4-.8-.2-.3.2-.4.5-.2.8l.9 1.4C9 5.5 8.2 6.7 8 8.2zm2.3-2.1c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6zm3.4 0c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6z"/></svg></div><h2>Android</h2><p>Installation depuis Chrome avec l'option d'installation de l'application.</p><span class="choose">Voir l'installation</span></button>
<button class="platform" data-platform="windows" type="button"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Windows"><path d="M2 4.2 10.5 3v8H2V4.2zm10-1.4L22 1.4V11H12V2.8zM2 13h8.5v8L2 19.8V13zm10 0h10v9.6L12 21.2V13z"/></svg></div><h2>Windows</h2><p>Installation avec Chrome ou Microsoft Edge.</p><span class="choose">Voir l'installation</span></button>
<button class="platform" data-platform="mac" type="button"><div class="platform-icon"><svg viewBox="0 0 24 24" aria-label="Apple"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8z"/></svg></div><h2>Mac</h2><p>Installation avec Safari, Chrome ou Edge selon ton navigateur.</p><span class="choose">Voir l'installation</span></button>
</section>
<div class="bottom"><a class="home" href="https://vmradio.fr/">Ouvrir VM RADIO</a><p class="small">VM RADIO · Application officielle</p></div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="dialog-head"><div class="dialog-icon" id="dialogIcon"></div><h2 id="dialogTitle"></h2><p class="dialog-sub" id="dialogSub"></p></div><div class="steps" id="steps"></div><button class="install" id="install" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10.17l3.59-3.58L18 11l-6 6-6-6 1.41-1.41L11 13.17V3zm-7 16h16v2H4v-2z"/></svg><span>Installer VM RADIO</span></button><div class="status" id="status"></div><button class="close" id="close" type="button">Fermer</button></div></div>
<script>
let deferredPrompt=null,platform='';
const overlay=document.getElementById('overlay'),icon=document.getElementById('dialogIcon'),title=document.getElementById('dialogTitle'),sub=document.getElementById('dialogSub'),steps=document.getElementById('steps'),install=document.getElementById('install'),status=document.getElementById('status');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;status.textContent='VM RADIO est installée sur ton appareil.';});
const icons={
 ios:'<svg viewBox="0 0 24 24" aria-label="Apple"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8z"/></svg>',
 android:'<svg viewBox="0 0 24 24" aria-label="Android"><path d="M7.2 9.2v8.1c0 .6.5 1.1 1.1 1.1h.8v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h1.4v2.4c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-2.4h.8c.6 0 1.1-.5 1.1-1.1V9.2H7.2zM5.8 9.2c-.6 0-1.1.5-1.1 1.1v6.3c0 .6.5 1.1 1.1 1.1s1.1-.5 1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zm12.4 0c-.6 0-1.1.5-1.1 1.1v6.3c0 .6-.5 1.1-1.1 1.1s-1.1-.5-1.1-1.1v-6.3c0-.6-.5-1.1-1.1-1.1zM8 8.2h8c-.2-1.5-1-2.7-2.1-3.5l.9-1.4c.2-.3.1-.6-.2-.8-.3-.2-.6-.1-.8.2l-.9 1.4c-.6-.2-1.2-.3-1.9-.3s-1.3.1-1.9.3l-.9-1.4c-.2-.3-.5-.4-.8-.2-.3.2-.4.5-.2.8l.9 1.4C9 5.5 8.2 6.7 8 8.2zm2.3-2.1c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6zm3.4 0c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6z"/></svg>',
 windows:'<svg viewBox="0 0 24 24" aria-label="Windows"><path d="M2 4.2 10.5 3v8H2V4.2zm10-1.4L22 1.4V11H12V2.8zM2 13h8.5v8L2 19.8V13zm10 0h10v9.6L12 21.2V13z"/></svg>',
 mac:'<svg viewBox="0 0 24 24" aria-label="Apple"><path d="M16.7 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.8.8-3.5.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-.1 2.8-1.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-4.2zM14.5 6.2c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1 1.8-.9 2.8z"/></svg>'
};
const content={ios:{title:'iPhone / iPad',sub:'Installation depuis Safari',steps:['Ouvre cette page avec Safari.','Appuie sur le bouton Partager.','Choisis « Sur l’écran d’accueil ».','Valide avec « Ajouter ».']},android:{title:'Android',sub:'Installation depuis Chrome',steps:['Ouvre cette page avec Chrome.','Appuie sur le menu ⋮.','Choisis « Installer l’application ».','Valide l’installation.']},windows:{title:'Windows',sub:'Installation depuis Chrome ou Edge',steps:['Ouvre cette page avec Chrome ou Edge.','Clique sur le bouton d’installation dans la barre d’adresse, s’il apparaît.','Sinon clique sur « Installer VM RADIO » ci-dessous.']},mac:{title:'Mac',sub:'Installation depuis Safari, Chrome ou Edge',steps:['Ouvre cette page dans ton navigateur.','Utilise l’option d’installation de l’application.','Sinon clique sur « Installer VM RADIO » ci-dessous.']}};
document.querySelectorAll('.platform').forEach(btn=>btn.addEventListener('click',()=>{platform=btn.dataset.platform;const c=content[platform];icon.innerHTML=icons[platform];title.textContent=c.title;sub.textContent=c.sub;steps.innerHTML='<ol>'+c.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol>';status.textContent=deferredPrompt?'Prêt pour l’installation.':'Le navigateur n’a pas encore proposé l’installation.';overlay.classList.add('open');}));
document.getElementById('close').addEventListener('click',()=>overlay.classList.remove('open'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});
install.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();if(deferredPrompt){try{await deferredPrompt.prompt();const {outcome}=await deferredPrompt.userChoice;status.textContent=outcome==='accepted'?'Installation lancée.':'Installation annulée.';}catch(err){status.textContent='Impossible de lancer l’installation automatiquement. Utilise l’option d’installation du navigateur.';}deferredPrompt=null;return;}if(platform==='ios'){status.textContent='Sur iPhone/iPad : Safari → Partager → Sur l’écran d’accueil → Ajouter.';return;}status.textContent='Aucune demande d’installation n’est disponible pour le moment. Utilise l’icône d’installation dans la barre d’adresse ou le menu du navigateur.';});
</script>

</html>
