name: Install maintenance gate

on:
  push:
    branches: [main]
    paths:
      - 'maintenance-gate.js'
      - '.github/workflows/install-maintenance-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject maintenance gate in HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tag = '<script src="/maintenance-gate.js?v=20260906-test-maintenance-v1"></script>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'maintenance-gate.js' in text:
                  continue

              if '<head>' in text:
                  text = text.replace('<head>', '<head>\n' + tag, 1)
              elif '<head ' in text:
                  pos = text.find('>\n', text.find('<head '))
                  if pos != -1:
                      text = text[:pos+2] + tag + '\n' + text[pos+2:]
                  else:
                      continue
              else:
                  continue

              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Pages modifiées:', ', '.join(changed) if changed else 'aucune')
          PY

      - name: Commit injected gate
        run: |
          if git diff --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Load maintenance gate on test app pages"
          git push
