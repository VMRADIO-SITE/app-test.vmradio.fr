name: Install maintenance gate

on:
  push:
    branches: [main]
    paths:
      - 'maintenance-gate.js'
      - 'maintenance-audio-sync.js'
      - '.github/workflows/install-maintenance-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject maintenance scripts in HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gate_tag = '<script src="/maintenance-gate.js?v=20260907-test-maintenance-v4"></script>'
          audio_tag = '<script src="/maintenance-audio-sync.js?v=20260907-test-maintenance-audio-v1"></script>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              if re.search(r'<script src="/?maintenance-gate\.js\?v=[^"]+"></script>', text):
                  text = re.sub(
                      r'<script src="/?maintenance-gate\.js\?v=[^"]+"></script>',
                      gate_tag,
                      text,
                      count=1
                  )
              elif '<head>' in text:
                  text = text.replace('<head>', '<head>\n' + gate_tag, 1)

              if re.search(r'<script src="/?maintenance-audio-sync\.js\?v=[^"]+"></script>', text):
                  text = re.sub(
                      r'<script src="/?maintenance-audio-sync\.js\?v=[^"]+"></script>',
                      audio_tag,
                      text,
                      count=1
                  )
              elif gate_tag in text:
                  text = text.replace(gate_tag, gate_tag + '\n' + audio_tag, 1)
              elif '<head>' in text:
                  text = text.replace('<head>', '<head>\n' + audio_tag, 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Pages modifiées:', ', '.join(changed) if changed else 'aucune')
          PY

      - name: Commit injected scripts
        run: |
          if git diff --quiet; then
            echo "Aucun changement à committer"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Load maintenance popup and jingle sync v4 on test app"

          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done

          echo "Impossible de publier les pages HTML après plusieurs tentatives."
          exit 1
