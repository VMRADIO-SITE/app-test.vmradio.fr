name: Install VM RADIO app logo

on: push

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Install new transparent logo and refresh caches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, re

          root = Path('.')
          version = '20260830-logo1'
          staged = root / '.github' / 'vm-radio-logo-master.b64'
          raw = ''.join(staged.read_text(encoding='utf-8').split())
          source = root / '.github' / 'vm-radio-logo-master.png'
          source.write_bytes(base64.b64decode(raw))

          im = Image.open(source).convert('RGBA')

          def save_png(path, size):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              img = im.resize((size, size), Image.Resampling.LANCZOS)
              img = img.quantize(colors=256, method=Image.Quantize.FASTOCTREE, dither=Image.Dither.NONE)
              img.save(path, 'PNG', optimize=True)

          save_png(root / 'vm-radio-appli-logo.png', 384)
          save_png(root / 'vm-radio-home-logo.png', 384)
          save_png(root / 'favicon-32.png', 32)
          save_png(root / 'favicon-64.png', 64)
          save_png(root / 'apple-touch-icon.png', 180)
          save_png(root / 'vmradio-app-icon-192.png', 192)
          save_png(root / 'vmradio-app-icon-512.png', 512)
          save_png(root / 'icons' / 'icon192-fixed.png', 192)

          ico = im.resize((256, 256), Image.Resampling.LANCZOS)
          ico.save(root / 'favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])

          for pattern in ('*.html', '*.js', '*.css'):
              for p in root.glob(pattern):
                  s = p.read_text(encoding='utf-8')
                  old = s
                  s = s.replace('./VM-RADIO-POPUP-LOGO.jpeg', f'./vm-radio-appli-logo.png?v={version}')
                  s = s.replace('VM-RADIO-POPUP-LOGO.jpeg', f'vm-radio-appli-logo.png?v={version}')
                  s = re.sub(r'favicon-64\.png(?:\?v=[^"\']+)?', f'favicon-64.png?v={version}', s)
                  s = re.sub(r'apple-touch-icon\.png(?:\?v=[^"\']+)?', f'apple-touch-icon.png?v={version}', s)
                  if p.name == 'vm-radio-flux-central.js':
                      s = re.sub(r'music-requests-ui\.js\?v=[^"\']+', f'music-requests-ui.js?v={version}', s)
                  if s != old:
                      p.write_text(s, encoding='utf-8')

          manifest = root / 'manifest.webmanifest'
          if manifest.exists():
              s = manifest.read_text(encoding='utf-8')
              s = re.sub(r'vmradio-app-icon-192\.png(?:\?v=[^"\']+)?', f'vmradio-app-icon-192.png?v={version}', s)
              s = re.sub(r'vmradio-app-icon-512\.png(?:\?v=[^"\']+)?', f'vmradio-app-icon-512.png?v={version}', s)
              manifest.write_text(s, encoding='utf-8')

          sw = root / 'sw.js'
          if sw.exists():
              s = sw.read_text(encoding='utf-8')
              s = re.sub(r'const CACHE_NAME\s*=\s*["\'][^"\']+["\']', 'const CACHE_NAME = "vm-radio-app-v58-logo1"', s, count=1)
              if '"./vm-radio-appli-logo.png"' not in s and 'const APP_SHELL = [' in s:
                  s = s.replace('const APP_SHELL = [', 'const APP_SHELL = [\n  "./vm-radio-appli-logo.png",', 1)
              sw.write_text(s, encoding='utf-8')

          source.unlink(missing_ok=True)
          staged.unlink(missing_ok=True)
          print('VM RADIO logo installed:', version)
          PY

      - name: Commit and push
        run: |
          git config user.name 'VM RADIO'
          git config user.email 'actions@vmradio.fr'
          git rm -f .github/workflows/install-vm-radio-app-logo.yml
          git add -A
          git commit -m 'Update VM RADIO app logo, welcome popup and PWA icons'
          git push
