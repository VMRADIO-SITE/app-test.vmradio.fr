name: Install VM RADIO app logo

on:
  push:
    branches: [main]
    paths:
      - 'vm-radio-appli-logo.svg'

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer
        run: python3 -m pip install --quiet pillow cairosvg

      - name: Render logo assets and refresh references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg, io, re

          root = Path('.')
          version = '20260830-logo2'
          svg = root / 'vm-radio-appli-logo.svg'

          png_1024 = cairosvg.svg2png(bytestring=svg.read_bytes(), output_width=1024, output_height=1024)
          master = Image.open(io.BytesIO(png_1024)).convert('RGBA')

          def save_png(path, size):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              img = master.resize((size, size), Image.Resampling.LANCZOS)
              img.save(p, 'PNG', optimize=True)

          save_png('vm-radio-appli-logo.png', 512)
          save_png('vm-radio-home-logo.png', 512)
          save_png('favicon-32.png', 32)
          save_png('favicon-64.png', 64)
          save_png('apple-touch-icon.png', 180)
          save_png('vmradio-app-icon-192.png', 192)
          save_png('vmradio-app-icon-512.png', 512)
          save_png('icons/icon192-fixed.png', 192)

          ico = master.resize((256, 256), Image.Resampling.LANCZOS)
          ico.save(root / 'favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])

          # Popup accueil + pochette par defaut des demandes.
          for pattern in ('*.html', '*.js', '*.css'):
              for p in root.glob(pattern):
                  s = p.read_text(encoding='utf-8')
                  old = s
                  s = s.replace('./VM-RADIO-POPUP-LOGO.jpeg', f'./vm-radio-appli-logo.png?v={version}')
                  s = s.replace('VM-RADIO-POPUP-LOGO.jpeg', f'vm-radio-appli-logo.png?v={version}')
                  s = re.sub(r'favicon-64\.png(?:\?v=[^"\']+)?', f'favicon-64.png?v={version}', s)
                  s = re.sub(r'apple-touch-icon\.png(?:\?v=[^"\']+)?', f'apple-touch-icon.png?v={version}', s)
                  if p.name == 'vm-radio-flux-central.js':
                      s = re.sub(r'music-requests-ui\.js\?v=[^"\']+', f'music-requests-ui.js?v={version}', s)
                  if s != old:
                      p.write_text(s, encoding='utf-8')

          manifest = root / 'manifest.webmanifest'
          if manifest.exists():
              s = manifest.read_text(encoding='utf-8')
              s = re.sub(r'vmradio-app-icon-192\.png(?:\?v=[^"\']+)?', f'vmradio-app-icon-192.png?v={version}', s)
              s = re.sub(r'vmradio-app-icon-512\.png(?:\?v=[^"\']+)?', f'vmradio-app-icon-512.png?v={version}', s)
              manifest.write_text(s, encoding='utf-8')

          sw = root / 'sw.js'
          if sw.exists():
              s = sw.read_text(encoding='utf-8')
              s = re.sub(r'const CACHE_NAME\s*=\s*["\'][^"\']+["\']', 'const CACHE_NAME = "vm-radio-app-v58-logo2"', s, count=1)
              if '"./vm-radio-appli-logo.png"' not in s and 'const APP_SHELL = [' in s:
                  s = s.replace('const APP_SHELL = [', 'const APP_SHELL = [\n  "./vm-radio-appli-logo.png",', 1)
              sw.write_text(s, encoding='utf-8')

          print('Rendered VM RADIO logo assets:', version)
          PY

      - name: Commit generated assets
        run: |
          git config user.name 'VM RADIO'
          git config user.email 'actions@vmradio.fr'
          git add -A
          git commit -m 'Update VM RADIO logo, welcome popup and PWA icons' || exit 0
          git push
