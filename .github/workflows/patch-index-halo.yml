name: Patch app index halo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index-halo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index player directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old=text

          marker='/* VM RADIO INDEX SOURCE HALO V1 */'
          css='''\n<style id="vmradio-index-source-halo">\n/* VM RADIO INDEX SOURCE HALO V1 */\n#cover{\n  --vm-source-color:#a855f7;\n  border:2px solid var(--vm-source-color)!important;\n  box-shadow:0 0 0 1px var(--vm-source-color),0 0 14px var(--vm-source-color),0 0 30px color-mix(in srgb,var(--vm-source-color) 55%,transparent)!important;\n  transition:border-color .35s ease,box-shadow .35s ease!important;\n}\n#cover[data-vm-source-kind="rotation"]{--vm-source-color:#a855f7}\n#cover[data-vm-source-kind="request"]{--vm-source-color:#f5a524}\n#cover[data-vm-source-kind="emission"]{--vm-source-color:#39d353}\n#cover[data-vm-source-kind="jingle"]{--vm-source-color:#ec4899}\n.vm-index-source-legend{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px 12px;margin:11px 0 10px;padding:7px 9px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(7,4,11,.48);font:700 8.5px/1.2 Arial,sans-serif;color:#aaa2b5}\n.vm-index-source-item{display:inline-flex;align-items:center;gap:5px;opacity:.65}\n.vm-index-source-item:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}\n.vm-index-source-item[data-kind="rotation"]{--c:#a855f7}.vm-index-source-item[data-kind="request"]{--c:#f5a524}.vm-index-source-item[data-kind="emission"]{--c:#39d353}.vm-index-source-item[data-kind="jingle"]{--c:#ec4899}\n.vm-index-source-legend[data-active-kind="rotation"] [data-kind="rotation"],.vm-index-source-legend[data-active-kind="request"] [data-kind="request"],.vm-index-source-legend[data-active-kind="emission"] [data-kind="emission"],.vm-index-source-legend[data-active-kind="jingle"] [data-kind="jingle"]{opacity:1;color:#fff;transform:scale(1.05)}\n</style>\n'''
          if marker not in text:
              text=text.replace('</head>',css+'</head>',1)

          legend='''\n<div id="vmIndexSourceLegend" class="vm-index-source-legend" data-active-kind="rotation" aria-label="Signification des couleurs du halo"><span class="vm-index-source-item" data-kind="rotation">Rotation</span><span class="vm-index-source-item" data-kind="request">Demande</span><span class="vm-index-source-item" data-kind="emission">Émission</span><span class="vm-index-source-item" data-kind="jingle">Jingle</span></div>\n'''
          if 'id="vmIndexSourceLegend"' not in text:
              needle='''      </div>\n      <h1 id="title">'''
              text=text.replace(needle,'      </div>'+legend+'      <h1 id="title">',1)

          script='''\n<script id="vmradio-index-source-halo-script">\n(function(){\n  const cover=document.getElementById('cover');\n  const legend=document.getElementById('vmIndexSourceLegend');\n  if(!cover||!legend)return;\n  const norm=v=>{let s=String(v||'').trim();try{s=s.normalize('NFD')}catch{}return s.replace(/[\\u0300-\\u036f]/g,'').toLowerCase()};\n  function classify(d){\n    const now=d?.now_playing||{},raw=d?.raw?.engine?.current||{};\n    const playlist=String(raw?.scheduleName||raw?.playlist||now?.playlist||d?.playlist||'').trim();\n    const p=norm(playlist),type=norm(raw?.type);\n    if(now?.is_request===true||type==='request')return 'request';\n    if(p.includes('jingle')||type.includes('jingle'))return 'jingle';\n    const general=!p||['rotation','rotation generale','general rotation','default','music','musique','playlist'].includes(p)||p.includes('rotation generale');\n    return general?'rotation':'emission';\n  }\n  function apply(kind){cover.dataset.vmSourceKind=kind;legend.dataset.activeKind=kind}\n  async function refresh(){\n    apply(cover.dataset.vmSourceKind||'rotation');\n    try{const r=await fetch('https://admin.vmradio.fr/api/radio/nowplaying?_indexhalo='+Date.now(),{cache:'no-store',credentials:'omit'});if(r.ok)apply(classify(await r.json()))}catch(_){ }\n  }\n  apply('rotation');refresh();setInterval(refresh,1500);\n})();\n</script>\n'''
          if 'id="vmradio-index-source-halo-script"' not in text:
              text=text.replace('</body>',script+'</body>',1)

          if text!=old:
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add source halo directly to app index player"
          git push
