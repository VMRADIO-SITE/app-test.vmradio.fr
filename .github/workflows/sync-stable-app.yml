name: Sync stable app to test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-stable-app.yml'

jobs:
  git-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone stable repository with Git
        run: |
          git clone --depth 1 https://github.com/VMRADIO-SITE/APPLIVMRADIO.git /tmp/vmradio-stable
          test -f /tmp/vmradio-stable/index.html
          echo "stable clone OK"
