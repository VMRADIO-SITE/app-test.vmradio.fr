name: Sync stable app to test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'chore: sync stable app into test repo'
    runs-on: ubuntu-latest

    steps:
      - name: Clone repositories and sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/vmradio-test" "$RUNNER_TEMP/vmradio-stable"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/vmradio-test"
          git clone --depth 1 https://github.com/VMRADIO-SITE/APPLIVMRADIO.git "$RUNNER_TEMP/vmradio-stable"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$RUNNER_TEMP/vmradio-stable/" "$RUNNER_TEMP/vmradio-test/"
          cd "$RUNNER_TEMP/vmradio-test"
          printf 'app-test.vmradio.fr\n' > CNAME
          git config user.name 'VM RADIO Test Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: sync stable app into test repo'
          git push origin main

# retrigger after enabling Actions
